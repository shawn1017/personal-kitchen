name: Deploy H5 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix import-service

      - name: Verify source and gateway
        run: npm run verify

      - name: Build H5
        run: npm run build:h5
        env:
          TARO_APP_IMPORT_API_BASE: https://fclhapemspdimjixbjzt.supabase.co/functions/v1/vercel-gateway

      - name: Verify H5 import runtime configuration
        env:
          TARO_APP_IMPORT_API_BASE: https://fclhapemspdimjixbjzt.supabase.co/functions/v1/vercel-gateway
        run: |
          if grep -R -q 'process.env.TARO_APP_IMPORT_API_BASE' dist-h5; then
            echo 'H5 bundle still contains a Node-only process.env reference.' >&2
            exit 1
          fi
          if ! grep -R -F -q "$TARO_APP_IMPORT_API_BASE" dist-h5; then
            echo 'H5 bundle is missing the configured import gateway URL.' >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-h5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
